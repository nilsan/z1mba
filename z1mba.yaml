# z1mba, the Z1 Multi-Bit Assistant: follows a Makera Z1 over the LAN and
# shows which bit to load at a tool change, on its own e-paper screen and in
# Home Assistant. Read-only: it only ever sends the status query. See
# README.md and docs/Z1-PROTOCOL.md.
#
# Built from packages; swap or drop them to suit your parts:
#   board     the ESP32 and the screen's pins        packages/board-*.yaml
#   screen    a preset per e-paper model and size    screens/*.yaml
#   home_assistant  leave out to run on its own      (z1mba-standalone.yaml)
# Your machine's address and anything else local go in a *.local.yaml
# (README.md, "Your machine").
packages:
  board: !include packages/board-freenove-s3.yaml
  core: !include packages/core.yaml
  wifi: !include packages/wifi.yaml
  home_assistant: !include packages/home-assistant.yaml
  screen: !include screens/weact-2.9in-3c.yaml

esphome:
  name: z1mba
  friendly_name: z1mba
  # Shown in Home Assistant as the firmware version; bump with the changes
  # that ship behaviour (patch: fix, minor: feature).
  project:
    name: nilsan.z1mba
    version: "0.2.0"
